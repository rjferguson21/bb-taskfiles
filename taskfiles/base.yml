# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  BIGBANG_DIR: /home/rob/bb/bigbang
  BIGBANG_K3D_CHART: oci://ghcr.io/rjferguson21/bb-k3d:0.3.4
  LOCAL_TMP: "{{.USER_WORKING_DIR}}/dev"

tasks:
  k3d-create:
    desc: Create a k3d cluster for testing with flux and MetalLB
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      TEMPLATE_VARS: --set=k3d.serverIP="0.0.0.0" --set=k3d.volumeBaseDir="{{.BASE_MOUNT_DIR}}" --set=registry1.username=$REGISTRY1_USERNAME --set=registry1.password=$REGISTRY1_PASSWORD
    cmds:
      - mkdir -p {{.LOCAL_TMP}}
      - mkdir -p {{.BASE_MOUNT_DIR}}/cypress
      - echo "*" >{{.LOCAL_TMP}}/.gitignore
      - helm template k3d "{{.BIGBANG_K3D_CHART}}" {{.TEMPLATE_VARS}} > {{.LOCAL_TMP}}/bootstrap.yaml
      - cat {{.LOCAL_TMP}}/bootstrap.yaml | yq e 'select(.kind == "Simple")' > {{.LOCAL_TMP}}/k3d.yaml
      - cat {{.LOCAL_TMP}}/bootstrap.yaml | yq e 'select(.kind == "ConfigMap" and .metadata.name == "bigbang-k3d-dev-values") | .stringData["values.yaml"]' > {{.LOCAL_TMP}}/dev-values.yaml
      - cat {{.LOCAL_TMP}}/bootstrap.yaml | yq e 'select(.kind == "ConfigMap" and .metadata.name == "bigbang-k3d-dev-values") | .stringData["etchost"]' > {{.LOCAL_TMP}}/etchost
      - DOCKER_HOST={{.DOCKER_HOST}} k3d cluster delete -a && DOCKER_HOST={{.DOCKER_HOST}} k3d cluster create --config {{.LOCAL_TMP}}/k3d.yaml --image=rancher/k3s:v1.37.0-k3s1
      - i=0; until kubectl get deployment helm-controller >/dev/null 2>&1 || [ $i -ge 3 ]; do sleep 1; i=$((i+1)); done

  setuphost:
    desc: Sets up etc hosts for k3d cluster host, creates cypress directory
    dir: '{{.USER_WORKING_DIR}}'
    status:
      - test -f {{.LOCAL_TMP}}/.setuphost-done
    cmds:
      - "{{ .COMMAND_PREFIX }} mkdir -p \"{{.BASE_MOUNT_DIR}}/cypress\""
      - "{{ .COMMAND_PREFIX }} sudo sed -i '/dev.bigbang.mil/d' /etc/hosts"
      - "cat {{.LOCAL_TMP}}/etchost | {{ .COMMAND_PREFIX }} sudo tee -a /etc/hosts"
      - touch {{.LOCAL_TMP}}/.setuphost-done

  external-dependencies:
    desc: "Start external PostgreSQL, Garage, and Valkey beside k3d and connect the cluster nodes to their network"
    vars:
      DEPENDENCIES_DIR: "{{.BIGBANG_DIR}}/docs/reference/scripts/developer/dependencies"
      K3D_DEV_POSTGRES_DATABASES: '{{.K3D_DEV_POSTGRES_DATABASES | default "gitlabhq_production,mattermost,anchore"}}'
      K3D_DEV_GARAGE_BUCKETS: '{{.K3D_DEV_GARAGE_BUCKETS | default ""}}'
    cmds:
      - docker ps -aq --filter 'name=bigbang-dev-' | xargs -r docker rm -f
      - docker volume ls -q --filter 'name=bigbang-dev-' | xargs -r docker volume rm
      - docker network inspect k3d-dependencies >/dev/null 2>&1 || docker network create --subnet 172.30.0.0/16 k3d-dependencies
      - for container in $(docker ps --filter 'name=k3d-bb-helm-' --format '{{`{{.Names}}`}}'); do docker network connect k3d-dependencies "$container" 2>/dev/null || true; done
      - K3D_DEV_POSTGRES_DATABASES='{{.K3D_DEV_POSTGRES_DATABASES}}' K3D_DEV_GARAGE_BUCKETS='{{.K3D_DEV_GARAGE_BUCKETS}}' {{.DEPENDENCIES_DIR}}/manage.sh up

  deploy:
    desc: "Deploy a BigBang instance to the k3d cluster. Use EXTRA_ARGS for additional values (e.g., EXTRA_ARGS='--values tests/test-values-ambient.yaml')"
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - helm upgrade --install bigbang {{.BIGBANG_DIR}}/chart
        --namespace=bigbang --create-namespace --values {{.BIGBANG_DIR}}/tests/test-values.yaml
        {{if eq .DISABLE_CORE "true"}}--values {{.BIGBANG_DIR}}/tests/disable-core-values.yaml{{end}}
        --values {{.BIGBANG_DIR}}/chart/ingress-certs.yaml
        --values {{.LOCAL_TMP}}/dev-values.yaml
        --set=registryCredentials.username=$REGISTRY1_USERNAME
        --set=registryCredentials.password=$REGISTRY1_PASSWORD
        --set=flux.interval=5s
        {{ .EXTRA_ARGS }}
      - kubectl wait helmrelease -A --selector=app.kubernetes.io/instance=bigbang --for=condition=ready --timeout=800s
