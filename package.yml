# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  BIGBANG_DIR: /home/rob/bb/bigbang
  PACKAGE: kiali
  RELEASE_NAME: kiali-kiali
  PACKAGE_PATH:
    sh: 'yq e ".. | (select(has(\"git\")) or (select(has(\"helmRepo\")))) | (path | join(\".\")) | select(. == \"*{{.PACKAGE}}\")" /home/rob/bb/bigbang/chart/values.yaml'
  BASE_MOUNT_DIR: "{{.USER_WORKING_DIR}}/dev"

includes:
  dev:
    taskfile: "./Taskfile.yml"

tasks:
  foo:
    cmds:
      - echo {{.BASE_MOUNT_DIR}}
  default:
      - task: dev:k3d:create
      - task: deploy
      - task: test
  deploy:
    dir: '{{.USER_WORKING_DIR}}'
    vars:
      BIGBANG_DIR: /home/rob/bb/bigbang
    cmds:
      - task: dev:deploy
        vars:
          BIGBANG_DIR: "{{.BIGBANG_DIR}}"
          EXTRA_ARGS: -f tests/test-values.yaml --set={{.PACKAGE_PATH}}.git.branch=$(git rev-parse --abbrev-ref HEAD) --set={{.PACKAGE_PATH}}.git.tag=null

  upgrade:
    vars:
      BIGBANG_DIR: /home/rob/bb/bigbang
    cmds:
      - task: dev:k3d:create
      - task: dev:deploy
        vars:
          BIGBANG_DIR: "{{.BIGBANG_DIR}}"
          EXTRA_ARGS: -f tests/test-values.yaml
      - task: deploy
      - task: test

  # Test Tasks
  test:unit:
    dir: '{{.USER_WORKING_DIR}}'
    watch: true
    sources:
      - 'chart/unittests/**/*_test.yaml'
    cmds:
      - helm unittest -f chart/unittests/**/*_test.yaml chart
  test:e2e:
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - rm -fr {{.BASE_MOUNT_DIR}}/cypress/*
      - helm test {{.RELEASE_NAME}} -n bigbang
  test:
    - task: test:unit
    - task: test:e2e
