# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  BIGBANG_DIR: /home/rob/bb/bigbang
  TASKFILE_DIR: /home/rob/bb/taskfiles
  BIGBANG_K3D_CHART: oci://ghcr.io/rjferguson21/helm/bb-k3d:0.1.3
  TEST_VALUES: tests/test-values.yaml

includes:
  dev:
    taskfile: "{{.TASKFILE_DIR}}/Taskfile.yml"

tasks:
  default:
      - task: dev:k3d:create
      - task: deploy
      - task: test
  deploy:
    vars:
      BIGBANG_DIR: /home/rob/bb/bigbang
    cmds:
      - task: dev:deploy
        vars:
          BIGBANG_DIR: "{{.BIGBANG_DIR}}"
          EXTRA_ARGS: -f tests/test-values.yaml --set=.git.branch=$(git rev-parse --abbrev-ref HEAD) --set=.git.tag=null
    
  upgrade:
    vars:
      BIGBANG_DIR: /home/rob/bb/bigbang
    cmds:
      - task: dev:k3d:create
      - task: dev:deploy
        vars:
          BIGBANG_DIR: "{{.BIGBANG_DIR}}"
          EXTRA_ARGS: -f tests/test-values.yaml
      - task: deploy
      - task: test

  test:unit:
    watch: true
    sources:
      - 'chart/unittests/**/*_test.yaml'
    cmds:
      - helm unittest -f "chart/unittests/**/*_test.yaml" chart

  test:
    cmds:
      - helm test monitoring-monitoring -n bigbang
    
  templateold:
    cmds:
      - helm template oci://registry1.dso.mil/bigbang/kiali:2.12.0-bb.1 --set=bbtests.enabled=true --set=networkPolicies.enabled=true | yq e 'select(.kind == "NetworkPolicy")'
  templatenew:
    cmds:
      - helm template chart --set=networkPolicies.enabled=true --set=bbtests.enabled=true | yq e 'select(.kind == "NetworkPolicy")'